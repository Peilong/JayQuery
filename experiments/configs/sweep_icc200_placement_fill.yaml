# Placement grid, backfill pass.
#
# Covers a scattered subset of the placement grid's cells. `method: grid`
# enumerates a cross-product, so each wanted cell is one value of a single
# `cell` axis, "<placement>|<epsilon>|<seed>", split back into the three real
# axes by expand_cell() in the pre-trial hook (utils/wandb_utils.py).
name: icc200-placement-backfill
method: grid
metric:
  name: val/auc_best
  goal: maximize
parameters:
  cell:
    values:
      - "server|1|42"
      - "server|1|44"
      - "server|4|42"
      - "server|4|43"
      - "server|4|44"
      - "server|8|42"
      - "server|8|43"
      - "server|8|44"
      - "cut-layer|1|42"
      - "cut-layer|1|43"
      - "cut-layer|4|42"
      - "cut-layer|4|43"
      - "cut-layer|4|44"
      - "cut-layer|8|42"
      - "cut-layer|8|43"
      - "cut-layer|8|44"
      - "label|0.5|44"
      - "label|1|42"
      - "label|1|43"
      - "label|1|44"
      - "label|2|44"
      - "label|4|42"
      - "label|4|43"
      - "label|4|44"
      - "label|8|42"
      - "label|8|43"
      - "label|8|44"
      - "all|0.5|42"
      - "all|0.5|44"
      - "all|1|43"
      - "all|2|42"
      - "all|2|43"
      - "all|2|44"
      - "all|4|42"
      - "all|4|43"
      - "all|4|44"
      - "all|8|42"
  processed-dir:
    value: data/processed/dedup_first
  num-server-rounds:
    value: 200
  embedding-dim:
    value: 32
  batch-sample-rate:
    value: 0.05
  combined-target-epsilon:
    value: 1000.0
