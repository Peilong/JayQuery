experiment:
  id: 1
  name: centralized_baselines
  week: 3
  description: "Train LogReg, MLP, XGBoost, and isolated-silo baselines. Establishes performance ceiling."
  owner: alex

data:
  module: BBB_2013J
  processed_dir: data/processed
  seed: 42

training:
  batch_size: 64
  epochs: 50
  learning_rate: 1e-3
  dropout_rate: 0.2
  early_stopping_patience: 10

baselines:
  - logistic_regression
  - centralized_mlp
  - xgboost
  - isolated_silo_a
  - isolated_silo_b

privacy:
  epsilon: .inf
  delta: 0.0
  dp_enabled: false
