experiment:
  id: 1
  name: centralized_baselines
  week: 3
  description: "Ceiling baselines + architecture-matched controls for the VFL comparison."
  owner: alex

data:
  processed_dir: data/processed
  seed: 42
  assert_module: CCC_2014J    # set to whatever prepare_silos actually wrote; runner should verify
  smote: false

evaluation:
  metrics: [auc_roc, accuracy, f1_macro, precision, recall, brier_score]
  threshold: tuned_on_val     # or 0.5 — but same policy for every model
  class_weighting: none       # must match pos-weight=0 in the VFL run

architecture:                 # mirror the VFL run exactly
  input_dim_a: 18
  input_dim_b: 26  # rate_v1 layout (docs/DATA_DICTIONARY.md)
  embedding_dim: 32
  hidden_dim_a: 64
  hidden_dim_b: 96
  hidden_dim_top: 128
  dropout_a: 0.2
  dropout_b: 0.2
  dropout_top: 0.237

ceiling_baselines:            # tuned to their best
  - name: logistic_regression
    params: {C: 1.0, penalty: l2, max_iter: 1000}
  - name: xgboost
    params: {n_estimators: 200, max_depth: 5, learning_rate: 0.05, scale_pos_weight: 1.0}

matched_baselines:            # identical training budget to VFL
  - centralized_mlp
  - isolated_silo_a
  - isolated_silo_b

training:
  learning_rate: 5e-4
  optimizer: adam
  gradient_steps: 55        # match the VFL run's actual step count
  batch_fraction: 0.05      # match batch-sample-rate
  warmup_steps: 25
  grad_clip_norm: 2

privacy:
  dp_enabled: false
  epsilon: .inf