# ICC 2027 no-DP baseline: 5 seeds, no epsilon axis.
#
# Split out of sweep_icc_placement.yaml because epsilon is meaningless with
# every channel off -- crossing it with the epsilon grid would run the same
# configuration 25 times instead of 5.
name: icc-baseline
method: grid
metric:
  name: val/auc_best
  goal: maximize
parameters:
  placement:
    value: none
  seed:
    values: [42, 43, 44]
  # The prepared cohort these results are computed on. Named here so the
  # sweep is self-describing: pyproject's bare data/processed has no silos.
  processed-dir:
    value: data/processed/dedup_first
  num-server-rounds:
    value: 100
  embedding-dim:
    value: 32
  batch-sample-rate:
    value: 0.05
