# Cut-layer width sweep (C3), d=32 and d=64 at 3 seeds.
#
# Same settings as sweep_icc200_width.yaml, restricted to two widths so no
# already-completed cell is re-run.
name: icc200-width-backfill
method: grid
metric:
  name: val/auc_best
  goal: maximize
parameters:
  embedding-dim:
    values: [32, 64]
  seed:
    values: [42, 43, 44]
  placement:
    value: cut-layer
  epsilon:
    value: 1
  processed-dir:
    value: data/processed/dedup_first
  num-server-rounds:
    value: 200
  batch-sample-rate:
    value: 0.05
  combined-target-epsilon:
    value: 1000.0
