# ── STATUS (2026-07-18): NOT WIRED TO THE CURRENT WORKFLOW ──────────────────
# Nothing consumes this file. VFL runs are configured by [tool.flwr.app.config]
# in pyproject.toml and launched via `python scripts/run_deployment.py`; the old
# `python -m fl_server.server --config <this file>` entry point never existed.
#
# How this file SHOULD be consumed: run_deployment.py gains a small YAML loader
# that translates these values into a `flwr run --run-config` override string
# (it already does this for --rounds → num-server-rounds).
#
# What must change to match the current workflow:
#   - Rename keys to the run-config names: num_rounds → num-server-rounds,
#     learning_rate → learning-rate, etc. (see pyproject [tool.flwr.app.config]).
#   - Fix stale values: input_dim_a is now 18, input_dim_b is now 27, default
#     module is CCC_2014J, learning rate default is 1e-2.
#   - Replace the `privacy:` block with the split-design keys:
#     server-dp-enabled=false, cut-noise-enabled=false (this is the no-DP run).
#   - Drop `server:` (run_deployment.py manages SuperLink host/ports) and
#     `batch_size` (batching is Poisson via batch-sample-rate).
# ─────────────────────────────────────────────────────────────────────────────
experiment:
  id: 2
  name: vfl_no_dp
  week: 5
  description: "Full VFL (SplitNN) without Differential Privacy. Upper bound for VFL performance."
  owner: alex

server:
  host: localhost
  port: 8080

data:
  module: BBB_2013J
  processed_dir: data/processed
  seed: 42

training:
  num_rounds: 50
  batch_size: 64
  learning_rate: 1e-3
  dropout_rate: 0.3
  embedding_dim: 32
  early_stopping_patience: 10
  lr_scheduler: reduce_on_plateau

model:
  input_dim_a: 12
  input_dim_b: 22
  embedding_dim: 32
  top_model_dropout: 0.2

privacy:
  dp_enabled: false
  epsilon: .inf
  delta: 1.0e-5
  max_grad_norm: 1.0

logging:
  wandb_project: jayquery
  log_every_n_rounds: 1
