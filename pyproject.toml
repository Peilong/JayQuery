[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jayquery"
version = "0.1.0"
description = "Privacy-Preserving Student Success Prediction with Vertical Federated Learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alex Pellet", email = "pellet@etown.edu" },
    { name = "Wyatt Wilfong", email = "wilfong@etown.edu" },
]

[tool.setuptools.packages.find]
include = ["utils*", "psi*", "silo_a*", "silo_b*", "baselines*", "fl_client*", "fl_server*", "privacy*", "proto*"]
exclude = ["data*", "notebooks*", "scripts*", "experiments*", "attack*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN"]
"notebooks/*" = ["ANN", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "psi: PSI protocol tests",
    "dp: Differential Privacy tests",
    "model: Model architecture tests",
    "integration: End-to-end integration tests",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "notebooks/*", "scripts/*", "experiments/*"]

# ── Flower federation config ──────────────────────────────────────
[tool.flwr.app]
publisher = "jayquery"

[tool.flwr.app.components]
serverapp = "fl_server.server_app:app"
clientapp = "fl_client.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 50
learning-rate = 1e-3
embedding-dim = 32
input-dim-a = 12
input-dim-b = 22
processed-dir = "data/processed"
