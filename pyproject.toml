[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jayquery"
version = "0.1.0"
description = "Privacy-Preserving Student Success Prediction with Vertical Federated Learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alex Pellet", email = "pellet@etown.edu" },
    { name = "Wyatt Wilfong", email = "wilfong@etown.edu" },
]

[tool.setuptools.packages.find]
include = ["utils*", "psi*", "silo_a*", "silo_b*", "baselines*", "fl_client*", "fl_server*", "privacy*", "scripts*"]
exclude = ["data*", "notebooks*", "experiments*", "attack*"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "ANN"]
lint.ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"notebooks/*" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["psi", "silo_a", "silo_b", "fl_server", "fl_client", "privacy", "baselines", "utils", "scripts"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "psi: PSI protocol tests",
    "dp: Differential Privacy tests",
    "model: Model architecture tests",
    "integration: End-to-end integration tests",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "notebooks/*", "scripts/*", "experiments/*"]

# ── Flower federation config ──────────────────────────────────────
[tool.flwr.app]
publisher = "jayquery"

# NOTE: each pattern below must match at least one real file/dir in this
# project or `flwr build`/`flwr run` will raise a ValueError ("did not match
# any files").
fab-include = [
    "fl_client/**/*.py",
    "fl_server/**/*.py",
    "privacy/**/*.py",
    "psi/**/*.py",
    "silo_a/**/*.py",
    "silo_b/**/*.py",
    "utils/**/*.py",
    "pyproject.toml",
    "LICENSE",
]

[tool.flwr.app.components]
serverapp = "fl_server.server_app:app"
clientapp = "fl_client.client_app:app"

[tool.flwr.app.config]
pos-weight = 0 # -1 = auto (n_neg/n_pos), 0 = disabled, >0 = explicit override
num-server-rounds = 200   # section K3 settled horizon — every arm is within its noise bar here
learning-rate = 0.0005
embedding-dim = 32
input-dim-a = 18
input-dim-b = 26 # rate_v1 layout; legacy v0 datasets need 27 (docs/DATA_DICTIONARY.md)
hidden-dim-a = 64
hidden-dim-b = 96
hidden-dim-top = 32
dropout-a = 0.2
dropout-b = 0.2
dropout-top = 0.237
# The three reported cohorts live in data/processed/dedup_{first,best,worst}. The bare
# data/processed/ directory still holds LEGACY single-module pickles (1,843 train rows vs
# 20,411), so defaulting there silently trained every un-overridden run on 11x less data.
# dedup_first is the primary variant (docs/action_plan.md section E-a).
processed-dir = "data/processed/dedup_first"
run-tag = ""
seed = 42
batch-sample-rate = 0.05
server-dp-enabled = true
server-dp-epsilon = 1.0
server-dp-delta = 1e-5
server-dp-max-grad-norm = 4.0
cut-noise-enabled = true
cut-noise-target-epsilon = 1.0
cut-noise-delta = 1e-5
cut-noise-max-norm = 1.0
# See scripts/measure_embedding_norms.py and docs/action_plan.md.
cut-noise-max-norm-a = 1.0
cut-noise-max-norm-b = 1.0
# Backstop on the COMPOSED epsilon across all sources. This is a guardrail, not a
# scientific parameter — but at 3.0 it bound during the epsilon sweep: the eps=4 arm hit
# composed 2.981 and all 5 seeds stopped at round ~50 of 200, making that point measure
# under-training rather than noise (FINDINGS.md §2h). Raised so it does not bind across
# the swept range (two silos at eps=4 compose to at most ~8); the composed epsilon each
# run ACTUALLY spent is recorded in meta.json and reported, so nothing is hidden by this.
combined-target-epsilon = 10.0
track-wandb = true
wandb-log-interval = 25
wandb-entity = "jayquery"
wandb-project = "jayquery-vfl"
wandb-run-name = ""
wandb-group = "test-post-privacy"
wandb-sweep-tag = ""
wandb-mode = "online"
loss-ema-alpha = 0.1
eval-every = 5
early-stop-patience = 20
early-stop-min-delta = 0.0001
lr-warmup-rounds = 10
lr-warmup-start-factor = 0.1
lr-plateau-factor = 0.5
lr-plateau-patience = 3
lr-min = 0.000001
grad-clip-norm = 2
