[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jayquery"
version = "0.1.0"
description = "Privacy-Preserving Student Success Prediction with Vertical Federated Learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Alex Pellet", email = "pellet@etown.edu" },
    { name = "Wyatt Wilfong", email = "wilfong@etown.edu" },
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.per-file-ignores]
"tests/*" = ["ANN"]
"notebooks/*" = ["ANN", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "psi: PSI protocol tests",
    "dp: Differential Privacy tests",
    "model: Model architecture tests",
    "integration: End-to-end integration tests",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "notebooks/*", "scripts/*", "experiments/*"]
