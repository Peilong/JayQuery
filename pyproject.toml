[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jayquery"
version = "0.1.0"
description = "Privacy-Preserving Student Success Prediction with Vertical Federated Learning"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alex Pellet", email = "pellet@etown.edu" },
    { name = "Wyatt Wilfong", email = "wilfong@etown.edu" },
]

[tool.setuptools.packages.find]
include = ["utils*", "psi*", "silo_a*", "silo_b*", "baselines*", "fl_client*", "fl_server*", "privacy*", "proto*"]
exclude = ["data*", "notebooks*", "scripts*", "experiments*", "attack*"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.select = ["E", "F", "I", "UP", "ANN"]
lint.ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"notebooks/*" = ["ANN", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["psi", "silo_a", "silo_b", "fl_server", "fl_client", "privacy", "baselines", "utils", "proto"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "psi: PSI protocol tests",
    "dp: Differential Privacy tests",
    "model: Model architecture tests",
    "integration: End-to-end integration tests",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "notebooks/*", "scripts/*", "experiments/*"]

# ── Flower federation config ──────────────────────────────────────
[tool.flwr.app]
publisher = "jayquery"

# NOTE: each pattern below must match at least one real file/dir in this
# project or `flwr build`/`flwr run` will raise a ValueError ("did not match
# any files").
fab-include = [
    "fl_client/**/*.py",
    "fl_server/**/*.py",
    "privacy/**/*.py",
    "psi/**/*.py",
    "silo_a/**/*.py",
    "silo_b/**/*.py",
    "utils/**/*.py",
    "pyproject.toml",
    "LICENSE",
]

[tool.flwr.app.components]
serverapp = "fl_server.server_app:app"
clientapp = "fl_client.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 50
learning-rate = 1e-2
embedding-dim = 32
input-dim-a = 18
input-dim-b = 27
processed-dir = "data/processed"
server-dp-enabled = false
server-dp-epsilon = 1.0
server-dp-delta = 1e-5
server-dp-max-grad-norm = 1.0
server-dp-epochs = 10
track-wandb=false